<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LIVE SURVIVORS - Painel</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0f1a;
        --panel: #181c2e;
        --line: #2b3150;
        --text: #e8ecff;
        --muted: #8a93b8;
        --accent: #ffd23f;
        --ok: #4ade80;
        --bad: #f87171;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: 1px; }
      h2 { margin: 0 0 12px; font-size: 15px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
      .subtitle { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
      .grid { display: grid; grid-template-columns: 340px 1fr; gap: 16px; align-items: start; }
      @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
      .status-line { font-size: 14px; margin: 6px 0; }
      .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
      .dot.open { background: var(--ok); }
      .dot.closed { background: var(--bad); }
      .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      button {
        background: #232945;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        font-size: 14px;
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .auto { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
      .auto label { display: flex; align-items: center; gap: 8px; }
      input[type="range"] { width: 100%; }
      .muted { color: var(--muted); font-size: 13px; }
      .log {
        height: 520px;
        overflow-y: auto;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 13px;
        line-height: 1.6;
        background: #0a0c16;
        border-radius: 8px;
        padding: 12px;
        border: 1px solid var(--line);
      }
      .log .error { color: var(--bad); }
      .log .like { color: #ff7aa2; }
      .log .comment { color: #7ad7ff; }
      .log .gift { color: var(--accent); }
    </style>
  </head>
  <body>
    <h1>LIVE SURVIVORS</h1>
    <p class="subtitle">Painel de simulação de eventos da live. Use apenas na máquina local.</p>

    <div class="grid">
      <section class="card">
        <h2>Conexão</h2>
        <p class="status-line"><span id="connDot" class="dot"></span><span id="connText">conectando...</span></p>
        <p class="status-line muted" id="providerText">Provedor: -</p>

        <h2 style="margin-top: 18px">Simular eventos</h2>
        <div class="buttons">
          <button data-kind="like" data-count="1">Curtida</button>
          <button data-kind="like" data-count="10">10 curtidas</button>
          <button data-kind="comment" data-count="1">Comentário</button>
        </div>
        <h2 style="margin-top: 18px">Presentes por valor</h2>
        <div class="buttons">
          <button data-kind="gift" data-diamonds="1">Rosa · 1 · TURBO</button>
          <button data-kind="gift" data-diamonds="20">Chapéu · 20 · ESCUDO</button>
          <button data-kind="gift" data-diamonds="100">Leão · 100 · NOVA</button>
          <button data-kind="gift" data-diamonds="500">Foguete · 500 · TEMPESTADE</button>
        </div>
        <div class="buttons" style="margin-top: 10px">
          <button id="resetLeaderboard">Zerar top 3 de presentes</button>
        </div>

        <div class="auto">
          <label><input type="checkbox" id="autoToggle" /> Modo automático</label>
          <label>
            Intervalo: <span id="intervalLabel">2000</span> ms
            <input type="range" id="intervalRange" min="300" max="10000" step="100" value="2000" />
          </label>
          <span class="muted">Mistura curtidas, comentários e presentes em intervalos regulares.</span>
        </div>
      </section>

      <section class="card">
        <h2>Eventos recebidos</h2>
        <div class="log" id="log" aria-live="polite"></div>
      </section>
    </div>

    <script type="module" src="/src/admin/main.ts"></script>
  </body>
</html>
